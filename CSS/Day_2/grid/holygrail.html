<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holy Grail</title>
    <style>
      div {
        display: grid;
        background-color: aquamarine;
        padding: 10px;
        grid-template-columns: 100px 1fr 100px;
        grid-template-rows: 100px 500px 100px;
        grid-template-areas: "header header header" "aside1 main aside2" "footer footer footer";
      }
      .child-1 {
        background-color: #ce4f66;
        padding: 3px;
        border: 2px solid black;
        grid-area: header;
      }
      .child-2 {
        background-color: #936060;
        padding: 3px;
        border: 2px solid black;
        grid-area: aside1;
      }
      .child-3 {
        background-color: #8dbd65;
        padding: 3px;
        border: 2px solid black;
        grid-area: main;
      }
      .child-4 {
        background-color: #9b5da7;
        padding: 3px;
        border: 2px solid black;
        grid-area: aside2;
      }
      .child-5 {
        background-color: #dff632;
        padding: 3px;
        border: 2px solid black;
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child-1">header</div>
      <div class="child-2">aside-1</div>
      <div class="child-3">main</div>
      <div class="child-4">aside-2</div>
      <div class="child-5">footer</div>
    </div>
  </body>
</html>
