<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>razorpay-clone</title>
  </head>
  <body>
    <nav class="bg-grayBlue">
      <div
        class="relative w-[1080px] mx-auto flex items-center justify-between"
      >
        <a href="/" class="cursor-pointer py-7 pr-7">
          <img
            src="https://razorpay.com/build/browser/static/razorpay-logo.5cdb58df.svg"
            width="125px"
            height="30px"
            alt="Razorpay Logo"
            class=""
          />
        </a>

        <ul class="flex space-x-6">
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Payments</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div>
          </li>
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Banking</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div>
          </li>
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Corporate Card</a>
            <!-- <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div> -->
          </li>
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Payroll</a>
            <!-- <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div> -->
          </li>
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Resources</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div>
          </li>
          <li
            class="text-white font-mullish py-7 hover:text-lightBlue cursor-pointer transition-all duration-200 relative group"
          >
            <a href="#">Pricing</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue hidden group-hover:block transition-all duration-200"
            ></div>
          </li>
        </ul>
        <div class="flex space-x-6">
          <img src="public\indiaFlag.svg" width="28px" height="20px" alt="" />
          <button
            class="p-[2px] rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600"
          >
            <span
              class="block px-5 py-3 font-mullish text-sm font-bold rounded-md bg-gray-900 text-white hover:bg-transparent transition"
            >
              Log in
            </span>
          </button>
          <button
            class="p-[2px] rounded-lg bg-gradient-to-r from-blue-500 to-indigo-500"
          >
            <span
              class="block px-5 py-3 font-mullish text-sm font-bold rounded-md bg-white text-blue-600 hover:bg-transparent hover:text-white transition"
            >
              Sign Up
            </span>
          </button>
        </div>
      </div>
    </nav>
    <!-- Hero Section -->
    <section class="relative bg-grayBlue">
      <div>
        <!-- Left Part -->
        <div>
          <h1>Power your finance, grow your business</h1>
          <div class="w-6 h-1 bg-greenLight"></div>
          <p>
            Accept payments from customers. Automate payouts to vendors &
            employees. Never run out of working capital.
          </p>
          <button>Sign Up Now</button>
        </div>

        <!-- Right Part -->
        <img src="" alt="" />
      </div>
      <!--Shape Part  -->
      <div>
        <img src="" alt="" />
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
